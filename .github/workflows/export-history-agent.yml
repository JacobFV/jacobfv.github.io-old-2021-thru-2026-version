name: export repository history (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: create and split git bundle
        run: |
          git bundle create repository.bundle --all
          split --bytes=400M --numeric-suffixes=0 --suffix-length=2 repository.bundle repository.bundle.part-
          ls -lh repository.bundle.part-*
      - uses: actions/upload-artifact@v4
        with:
          name: repository-bundle-part-00
          path: repository.bundle.part-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: repository-bundle-part-01
          path: repository.bundle.part-01
          compression-level: 0
          retention-days: 1
